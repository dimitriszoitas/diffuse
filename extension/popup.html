<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diffuse</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="ui-chrome.css">
  <link rel="stylesheet" href="ui-theme.css">
  <link rel="stylesheet" href="ui-dark.css">
  <script src="theme.js"></script>
  <script src="popup.js" defer></script>
</head>
<body data-surface="popup">
  <main class="popup" id="popup" aria-busy="true">
    <header class="brand-header"><div class="brand"><span class="brand-mark" aria-hidden="true"><span></span><span></span></span><span>Diffuse</span></div><span class="launcher-state" id="launcher-state">Page feedback</span></header>
    <section id="loading" class="initial-loading" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span>Getting your page ready…</section>
    <section id="setup" hidden aria-label="Start Diffuse">
      <div class="launcher-page"><p class="source-title" id="source-title">Your page</p><p class="source-url" id="source-url"></p></div>
      <form id="comparison-form"><button class="primary-button" id="start-comparison" type="submit" disabled><span class="button-label">Start Diffuse</span><span aria-hidden="true">→</span></button></form>
      <p id="page-access-message" class="feedback" role="status" hidden></p>
    </section>
    <section id="session-panel" hidden aria-label="Continue with Diffuse">
      <div class="launcher-page"><p class="source-title" id="session-target-title"></p><p id="session-subtitle" class="source-url">Continue your review</p></div>
      <button class="primary-button" id="return-to-comparison" type="button"><span class="button-label">Start Diffuse</span><span aria-hidden="true">→</span></button>
      <p class="session-error" id="session-error" role="alert" hidden></p>
    </section>
    <nav class="launcher-menu" aria-label="Diffuse">
      <button id="load-review" type="button" class="launcher-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg><span>Load Review</span><span class="launcher-chevron" aria-hidden="true">›</span></button>
      <button id="review-reports" type="button" class="launcher-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="15" height="18" rx="2"/><path d="M9 8h7m-7 4h7m-7 4h4M2 6v12"/></svg><span>Review Reports</span><span class="launcher-chevron" aria-hidden="true">›</span></button>
      <button id="settings" type="button" class="launcher-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 3-.6 2.3-2 .9-2.2-.6-2 3.5 1.7 1.7v2.4l-1.7 1.7 2 3.5 2.2-.6 2 .9.6 2.3h4l.6-2.3 2-.9 2.2.6 2-3.5-1.7-1.7v-2.4l1.7-1.7-2-3.5-2.2.6-2-.9-.6-2.3Z"/><circle cx="11.5" cy="12" r="3"/></svg><span>Settings</span><span class="launcher-chevron" aria-hidden="true">›</span></button>
    </nav>
    <section id="file-access-notice" class="file-access-notice" role="status" hidden><h2>Allow local file reviews</h2><p id="file-access-description"></p><button id="open-file-settings" class="secondary-button" type="button">Open Diffuse settings ↗</button><button id="refresh-file-access" class="secondary-button" type="button">Check access again</button></section>
    <div class="feedback" id="feedback" role="alert" tabindex="-1" hidden></div>
  </main>
</body>
</html>
